apiVersion: v1
kind: pod
metadata:
   name: emptydir-demo 
   namespace: 
   
spec:
   containers:
   - name: nginx
     image: nginx
     volumeMounts:
     - mountPath: /var/log/nginx
       name: nginx-logs
   - name: almalinux
     image: almalinux:9
     command: ["sleep", "1000"]
     volumeMounts:
     - mountPath: /opt/nginx-log
       name: nginx-logs
       readOnly: true
 
   volumes:
    - name: nginx-logs
      emptyDir:
        sizeLimit: 100Mi
    