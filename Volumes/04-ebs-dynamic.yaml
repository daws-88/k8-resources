##1. PVC
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: ebs-dynamic
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: roboshop-ebs
  resources:
    requests:
      storage: 5Gi

---
##2. Pod
apiVersion: v1
kind: Pod
metadata:
  name: nginx-ebs-dynamic
  labels:
    purpose: ebs-dynamic
spec:
  containers:
  - name: nginx
    image: nginx
    volumeMounts:
    - name: nginx-html
      mountPath: /usr/share/nginx/html

  volumes:
  - name: nginx-html
    persistentVolumeClaim:
      claimName: ebs-dynamic

---
# 4 .service 
apiVersion: v1
kind: Service
metadata:
  name: nginx-dynamic
spec:
  type: LoadBalancer
  selector:
    purpose: ebs-dynamic
  ports:
    - protocol: TCP
      port: 80 # service port
      targetPort: 80 # container port
      nodePort: 30007 
## no neeed of nodeselectors in dynamic provisioning
